---
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: shelly_device_exporter
    metrics_path: /probe
    params:
      module: [default]
    static_configs:
      - targets:
          - http://192.168.0.6
        labels:
          module: auth
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: shelly-device-exporter:8080
